<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="One private deposit in five steps inside a single atomic transaction. The STRK20 pool sends tokens to the Cellar helper contract, which deposits them into an ERC-4626 lending vault, receives shares back, hands them to the pool, and the pool credits a new encrypted note. If any step fails all five revert. An observer sees only that the pool paid a contract and how much, never who asked for it.">
  <rect width="940" height="470" fill="#fdfdfb"/>

  <text x="40" y="40" font-size="17" font-weight="700" fill="#1e1e1e">One private deposit — five steps, one transaction</text>
  <text x="40" y="64" font-size="14" fill="#868e96">if any step fails, all five revert · the helper never holds your money across blocks</text>

  <g transform="rotate(-0.15 470 214)">
    <rect x="28" y="88" width="884" height="252" rx="14" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="9 6"/>
  </g>
  <text x="46" y="112" font-size="12" font-weight="700" fill="#868e96" letter-spacing="1.4">ONE ATOMIC TRANSACTION</text>

  <g transform="rotate(0.4 150 202)">
    <rect x="55" y="150" width="190" height="104" rx="11" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
  </g>
  <text x="150" y="180" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1971c2">STRK20 POOL</text>
  <text x="150" y="203" font-size="12.5" text-anchor="middle" fill="#495057">holds your money as</text>
  <text x="150" y="221" font-size="12.5" text-anchor="middle" fill="#495057">an encrypted note</text>
  <text x="150" y="242" font-size="11" text-anchor="middle" fill="#868e96">already existed</text>

  <g transform="rotate(-0.5 470 202)">
    <rect x="375" y="150" width="190" height="104" rx="11" fill="#fff9db" stroke="#f08c00" stroke-width="3"/>
  </g>
  <text x="470" y="180" font-size="14.5" font-weight="700" text-anchor="middle" fill="#e8590c">CELLAR HELPER</text>
  <text x="470" y="203" font-size="12" text-anchor="middle" fill="#495057" font-family="monospace">privacy_invoke()</text>
  <text x="470" y="221" font-size="12.5" text-anchor="middle" fill="#495057">checks its allowlist</text>
  <text x="470" y="242" font-size="11" font-weight="700" text-anchor="middle" fill="#e8590c">WE BUILT THIS</text>

  <g transform="rotate(0.35 790 202)">
    <rect x="695" y="150" width="190" height="104" rx="11" fill="#f3f0ff" stroke="#6741d9" stroke-width="2.5"/>
  </g>
  <text x="790" y="180" font-size="14.5" font-weight="700" text-anchor="middle" fill="#6741d9">LENDING VAULT</text>
  <text x="790" y="203" font-size="12.5" text-anchor="middle" fill="#495057">ERC-4626 market</text>
  <text x="790" y="221" font-size="12.5" text-anchor="middle" fill="#495057">pays interest</text>
  <text x="790" y="242" font-size="11" text-anchor="middle" fill="#868e96">already existed</text>

  <text x="310" y="172" font-size="12.5" text-anchor="middle" fill="#1e1e1e" font-weight="600">1 · sends tokens</text>
  <path d="M249 186 C 275 181, 300 191, 367 186" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M359 179 L369 186 L359 193" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="630" y="172" font-size="12.5" text-anchor="middle" fill="#1e1e1e" font-weight="600">2 · deposits</text>
  <path d="M569 186 C 595 181, 620 191, 687 186" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M679 179 L689 186 L679 193" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M687 224 C 660 229, 636 219, 571 224" fill="none" stroke="#6741d9" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M579 217 L569 224 L579 231" fill="none" stroke="#6741d9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="630" y="246" font-size="12.5" text-anchor="middle" fill="#6741d9" font-weight="600">3 · gives back shares</text>

  <path d="M367 224 C 340 229, 316 219, 251 224" fill="none" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M259 217 L249 224 L259 231" fill="none" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="310" y="246" font-size="12.5" text-anchor="middle" fill="#e8590c" font-weight="600">4 · hands them over</text>

  <path d="M92 256 C 88 282, 96 294, 116 294 L 184 294 C 204 294, 210 282, 208 258" fill="none" stroke="#1971c2" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M201 266 L208 256 L215 266" fill="none" stroke="#1971c2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="318" font-size="12.5" text-anchor="middle" fill="#1971c2" font-weight="600">5 · credits a new encrypted note</text>

  <g transform="rotate(0.2 470 400)">
    <rect x="28" y="370" width="884" height="66" rx="11" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
  </g>
  <text x="50" y="396" font-size="12.5" font-weight="700" fill="#e03131" letter-spacing="1.2">WHAT AN OBSERVER ACTUALLY SEES</text>
  <text x="50" y="420" font-size="14" fill="#495057">&#8220;the pool paid some contract, and how much&#8221; — never <tspan font-weight="700" fill="#1e1e1e">who asked for it</tspan>, and never which note paid</text>
</svg>
