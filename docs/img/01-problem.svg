<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Today, anyone reading the chain can see a wallet's balance, its lending position and its full history. With Cellar, the same wallet shows nothing public; the funds sit inside a shared privacy pool where an observer sees only that someone is earning, not who.">
  <rect width="920" height="400" fill="#fdfdfb"/>

  <!-- ================= TODAY ================= -->
  <g transform="rotate(-0.3 235 200)">
    <rect x="30" y="30" width="400" height="340" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2.5"/>
  </g>
  <text x="56" y="66" font-size="15" font-weight="700" fill="#e03131" letter-spacing="1.6">TODAY</text>
  <text x="56" y="90" font-size="14" fill="#868e96">every public chain, right now</text>

  <!-- wallet card -->
  <g transform="rotate(0.5 230 150)">
    <rect x="60" y="112" width="340" height="46" rx="9" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  </g>
  <text x="78" y="141" font-size="15" fill="#1e1e1e"> your wallet</text>
  <text x="380" y="141" font-size="13" text-anchor="end" fill="#868e96" font-family="monospace">0x7f3a…c21b</text>

  <!-- exposed rows -->
  <g font-size="14.5" fill="#1e1e1e">
    <g transform="rotate(-0.4 230 190)">
      <rect x="60" y="172" width="340" height="38" rx="8" fill="#ffffff" stroke="#e03131" stroke-width="1.6" stroke-dasharray="7 4"/>
    </g>
    <text x="78" y="196">balance</text>
    <text x="380" y="196" text-anchor="end" font-family="monospace" fill="#e03131">12,400 USDC</text>

    <g transform="rotate(0.35 230 238)">
      <rect x="60" y="220" width="340" height="38" rx="8" fill="#ffffff" stroke="#e03131" stroke-width="1.6" stroke-dasharray="7 4"/>
    </g>
    <text x="78" y="244">lending position</text>
    <text x="380" y="244" text-anchor="end" font-family="monospace" fill="#e03131">8,000 in Vesu</text>

    <g transform="rotate(-0.25 230 286)">
      <rect x="60" y="268" width="340" height="38" rx="8" fill="#ffffff" stroke="#e03131" stroke-width="1.6" stroke-dasharray="7 4"/>
    </g>
    <text x="78" y="292">every payment ever made</text>
    <text x="380" y="292" text-anchor="end" font-family="monospace" fill="#e03131">47 txs</text>
  </g>

  <text x="230" y="336" font-size="14" text-anchor="middle" fill="#e03131" font-weight="600">anyone with your address can read all of it</text>

  <!-- ================= ARROW ================= -->
  <path d="M442 200 C 456 194, 462 206, 476 200" fill="none" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M468 193 L478 200 L468 207" fill="none" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= WITH CELLAR ================= -->
  <g transform="rotate(0.3 685 200)">
    <rect x="490" y="30" width="400" height="340" rx="14" fill="#f4fbf6" stroke="#2f9e44" stroke-width="2.5"/>
  </g>
  <text x="516" y="66" font-size="15" font-weight="700" fill="#2f9e44" letter-spacing="1.6">WITH CELLAR</text>
  <text x="516" y="90" font-size="14" fill="#868e96">same money, same yield</text>

  <!-- wallet card -->
  <g transform="rotate(-0.4 690 150)">
    <rect x="520" y="112" width="340" height="46" rx="9" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  </g>
  <text x="538" y="141" font-size="15" fill="#1e1e1e"> your wallet</text>
  <text x="840" y="141" font-size="13" text-anchor="end" fill="#868e96" font-family="monospace">0x7f3a…c21b</text>

  <g transform="rotate(0.4 690 190)">
    <rect x="520" y="172" width="340" height="38" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.6"/>
  </g>
  <text x="538" y="196" font-size="14.5" fill="#1e1e1e">public balance</text>
  <text x="840" y="196" font-size="14.5" text-anchor="end" font-family="monospace" fill="#2f9e44">— nothing</text>

  <!-- the pool -->
  <g transform="rotate(-0.3 690 262)">
    <rect x="520" y="224" width="340" height="82" rx="10" fill="#ffffff" stroke="#1971c2" stroke-width="2.5"/>
  </g>
  <text x="538" y="250" font-size="14" font-weight="700" fill="#1971c2"> STRK20 privacy pool</text>
  <text x="538" y="272" font-size="13.5" fill="#495057">everyone&#8217;s shielded funds, mixed together</text>
  <text x="538" y="292" font-size="13.5" fill="#495057">earning real yield the whole time</text>

  <text x="690" y="336" font-size="14" text-anchor="middle" fill="#2f9e44" font-weight="600">an observer sees &#8220;someone is earning&#8221; — not who</text>
</svg>
