<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="System architecture in three layers. In the browser, the Cellar web app is ours. The wallet, which holds the viewing key and generates zero-knowledge proofs, already existed. On Starknet, the STRK20 privacy pool and the ERC-4626 lending vault already existed; the YieldHelper anonymizer contract between them is ours. Cellar runs no backend and no database.">
  <rect width="920" height="520" fill="#fdfdfb"/>

  <text x="40" y="42" font-size="17" font-weight="700" fill="#1e1e1e">What we built, and what already existed</text>
  <text x="40" y="66" font-size="14" fill="#868e96">two boxes are ours — and they are the two the work actually lives in</text>

  <!-- legend -->
  <g transform="rotate(-0.3 745 44)">
    <rect x="640" y="26" width="60" height="24" rx="6" fill="#fff9db" stroke="#f08c00" stroke-width="2.5"/>
  </g>
  <text x="708" y="43" font-size="12.5" fill="#495057">ours</text>
  <g transform="rotate(0.3 800 44)">
    <rect x="762" y="26" width="60" height="24" rx="6" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  </g>
  <text x="830" y="43" font-size="12.5" fill="#495057">existed</text>

  <!-- ============ LAYER 1 : BROWSER ============ -->
  <text x="40" y="106" font-size="12" font-weight="700" fill="#868e96" letter-spacing="1.4">IN YOUR BROWSER</text>

  <g transform="rotate(0.25 460 148)">
    <rect x="40" y="116" width="840" height="66" rx="11" fill="#fff9db" stroke="#f08c00" stroke-width="3"/>
  </g>
  <text x="62" y="144" font-size="15" font-weight="700" fill="#e8590c">CELLAR WEB APP</text>
  <text x="62" y="167" font-size="13" fill="#495057" font-family="monospace">/ landing · /vault position · /prove disclosure · /verify · /day0</text>
  <text x="858" y="152" font-size="11.5" text-anchor="end" font-weight="700" fill="#e8590c">OURS</text>

  <path d="M460 184 C 456 194, 464 200, 460 210" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M453 202 L460 212 L467 202" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="478" y="203" font-size="12" fill="#868e96">asks the wallet to act</text>

  <!-- ============ LAYER 2 : WALLET ============ -->
  <g transform="rotate(-0.3 460 250)">
    <rect x="40" y="218" width="840" height="66" rx="11" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  </g>
  <text x="62" y="246" font-size="15" font-weight="700" fill="#1e1e1e">WALLET — Ready / Braavos</text>
  <text x="62" y="269" font-size="13" fill="#495057">holds your viewing key · finds your notes · builds the zero-knowledge proof · signs</text>
  <text x="858" y="254" font-size="11.5" text-anchor="end" fill="#868e96">EXISTED</text>

  <path d="M460 286 C 456 296, 464 302, 460 312" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M453 304 L460 314 L467 304" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="478" y="305" font-size="12" fill="#868e96">submits one transaction</text>

  <!-- ============ LAYER 3 : STARKNET ============ -->
  <text x="40" y="342" font-size="12" font-weight="700" fill="#868e96" letter-spacing="1.4">ON STARKNET</text>

  <g transform="rotate(0.2 460 412)">
    <rect x="40" y="352" width="840" height="120" rx="12" fill="none" stroke="#adb5bd" stroke-width="1.8" stroke-dasharray="8 5"/>
  </g>

  <!-- pool -->
  <g transform="rotate(-0.4 158 412)">
    <rect x="62" y="372" width="192" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
  </g>
  <text x="158" y="400" font-size="14" font-weight="700" text-anchor="middle" fill="#1971c2">PRIVACY POOL</text>
  <text x="158" y="421" font-size="12" text-anchor="middle" fill="#495057">encrypted notes</text>
  <text x="158" y="440" font-size="11" text-anchor="middle" fill="#868e96">EXISTED</text>

  <!-- helper (ours) -->
  <g transform="rotate(0.5 460 412)">
    <rect x="364" y="372" width="192" height="80" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="3"/>
  </g>
  <text x="460" y="400" font-size="14" font-weight="700" text-anchor="middle" fill="#e8590c">YIELDHELPER</text>
  <text x="460" y="421" font-size="12" text-anchor="middle" fill="#495057">~90 lines of Cairo</text>
  <text x="460" y="440" font-size="11" font-weight="700" text-anchor="middle" fill="#e8590c">OURS · 16 tests</text>

  <!-- vault -->
  <g transform="rotate(-0.35 762 412)">
    <rect x="666" y="372" width="192" height="80" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="2.5"/>
  </g>
  <text x="762" y="400" font-size="14" font-weight="700" text-anchor="middle" fill="#6741d9">LENDING VAULT</text>
  <text x="762" y="421" font-size="12" text-anchor="middle" fill="#495057">ERC-4626</text>
  <text x="762" y="440" font-size="11" text-anchor="middle" fill="#868e96">EXISTED</text>

  <!-- links between the three -->
  <path d="M256 412 C 280 406, 300 418, 356 412" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/>
  <path d="M348 405 L358 412 L348 419" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M558 412 C 582 406, 602 418, 658 412" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/>
  <path d="M650 405 L660 412 L650 419" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- no backend note -->
  <text x="460" y="500" font-size="13.5" text-anchor="middle" fill="#2f9e44" font-weight="600">no backend · no database · nothing about your position is stored on any server</text>
</svg>
